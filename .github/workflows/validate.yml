name: Validate QR Work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check required frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
      - name: Check required script and stylesheet references
        run: |
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
      - name: Check HTML structure
        run: |
          grep -q '<html' index.html
          grep -q '<body' index.html
          grep -q '</html>' index.html
