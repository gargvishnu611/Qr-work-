name: Validate QR Work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check admin-html/admin.js
      - name: Check required frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f admin-html/index.html
          test -f admin-html/admin.css
          test -f admin-html/admin.js
      - name: Check required references
        run: |
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          grep -q 'admin.css' admin-html/index.html
          grep -q 'admin.js' admin-html/index.html
          grep -q 'qrPreview' admin-html/index.html
          grep -q 'updatePreview' admin-html/admin.js
      - name: Ensure demo QR tasks are not seeded
        run: |
          ! grep -q 'function seedTasks' app.js
          ! grep -q 'authorized-test-001' app.js
      - name: Check HTML structure
        run: |
          grep -q '<html' index.html
          grep -q '<body' index.html
          grep -q '</html>' index.html
          grep -q '<html' admin-html/index.html
          grep -q '<body' admin-html/index.html
          grep -q '</html>' admin-html/index.html
